<style>
:root{--ink:#0b0620;--lilac:#c9b8ff;--ai:#ff2e6e;--tech:#ffe600;--cyber:#7c4dff;--line:#38257f}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:#fff;font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hero{position:relative;min-height:88svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 18px 34px;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}

.date{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--lilac);text-transform:uppercase}
.verdict{font-size:38px;line-height:1.05;font-weight:700;margin-top:10px}
.more{margin-top:18px;font-size:14px;color:var(--lilac)}
.sample{background:#fff;color:#000;font-size:12px;font-weight:700;padding:7px 16px}
.poster{min-height:84svh;padding:26px 18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.poster .k{position:absolute;top:24px;left:18px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.big{font-family:Anton,Impact,sans-serif;font-size:130px;line-height:1;white-space:nowrap}
.poster h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:44px;line-height:1.02;text-transform:uppercase;margin-top:8px}
.poster .noBig h2{font-size:64px}
.poster p{font-size:16px;line-height:1.38;font-weight:500;margin-top:12px}
.poster .sw{font-weight:700}
.poster a{display:inline-block;font-size:13px;margin-top:12px;font-weight:700;padding:6px 0}
.p-Tech{background:var(--tech);color:#000}
.p-AI{background:var(--ai);color:#fff}
.p-Cyber{background:var(--cyber);color:#fff}
.wrap{padding:26px 16px 36px}
.sect{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lilac);margin:6px 2px 12px}

.pill.AI{background:#ff7aa5}.pill.Tech{background:var(--tech)}.pill.Cyber{background:#b49cff}
.card h3{font-size:19px;line-height:1.22;margin:9px 0 6px}

.card .sw{color:#fff;margin-top:6px}
.card a{display:inline-block;font-size:13px;font-weight:700;color:#fff;margin-top:8px;padding:4px 0}
.card{cursor:pointer;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.99)}
.cue{display:block;margin-top:10px;font-size:13px;font-weight:700;color:var(--tech)}
.poster{cursor:pointer}
.poster .cue{color:inherit;margin-top:14px;font-size:14px;text-decoration:underline}
.sheet{position:fixed;inset:0;z-index:20;background:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--ink);border-bottom:1px solid var(--line)}
.sheet .close{font-size:15px;font-weight:700;padding:8px 14px;border:1px solid var(--line);border-radius:99px}
.sheet .body{padding:20px 18px 60px;max-width:680px;margin:0 auto}
.sheet h2{font-size:30px;line-height:1.1;margin:12px 0 8px}
.sheet .meta{font-size:13px;color:var(--lilac)}
.sheet h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lilac);margin:22px 0 6px}
.sheet p{font-size:17px;line-height:1.5}
.sheet .take{background:linear-gradient(160deg,#ff2e6e,#7c4dff);border-radius:18px;padding:16px;margin-top:24px}
.sheet .take h3{color:#fff;margin-top:0;opacity:.9}
.sheet .orig{display:block;margin-top:26px;font-size:14px;color:var(--lilac);padding:8px 0}
.lesson{background:linear-gradient(160deg,#ff2e6e,#7c4dff 58%,#16b8f0);border-radius:24px;padding:20px 18px;margin-top:22px}
.lesson small{font-size:13px;font-weight:700}

.lesson .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.diagram{display:block;width:100%;height:auto;margin:12px 0 14px}
.lesson ol{margin:0 0 12px 20px;font-size:15px;line-height:1.4}
.lesson li{margin-bottom:5px}
.q{display:block;width:100%;background:#fff;color:#2a1570;font-weight:700;padding:13px;border-radius:12px;margin-top:10px;font-size:15px;text-align:left}
.a{display:none;background:#0b0620cc;border-radius:12px;padding:12px;margin-top:6px;font-size:15px;line-height:1.4}
.a.on{display:block}
.nav{position:absolute!important;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:2}
.nav button{font-size:13px;font-weight:700;padding:8px 13px;border:1px solid var(--line);border-radius:99px;background:#160c3acc;backdrop-filter:blur(6px)}
.nav .lv{margin-left:auto;font-size:12px;font-weight:700;color:var(--lilac)}
.nav .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--ai);color:#fff;font-size:11px;line-height:18px;text-align:center}
.gcard{border-radius:22px;padding:18px;margin-top:16px;background:#160c3a;border:1px solid var(--line)}
.gcard h2{font-size:24px;line-height:1.1;margin:6px 0 8px}
.gcard p{font-size:15px;line-height:1.45;color:var(--lilac)}
.gcard .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tech)}
.gcard.quiz{background:linear-gradient(160deg,#ff2e6e,#7c4dff);border:0}
.gcard.quiz p,.gcard.quiz .lab{color:#fff}
.btn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:14px;background:#fff;color:#2a1570;font-weight:700;font-size:16px;text-align:center}
.btn.alt{background:transparent;color:#fff;border:1px solid #ffffff88;margin-top:8px}
.dots{display:flex;gap:6px;flex:1;margin:0 12px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--lilac)}.dots i.ok{background:#3ddc97}.dots i.no{background:var(--ai)}
.qcard h2{font-size:24px;line-height:1.2;margin:8px 0 18px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line);background:#160c3a;font-size:16px;line-height:1.35}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--line);text-align:center;line-height:26px;font-size:13px}
.opt.ok{border-color:#3ddc97;background:#0f3a2e}.opt.ok b{background:#3ddc97;color:#000}
.opt.no{border-color:var(--ai);background:#40122a}.opt.no b{background:var(--ai)}
.opt:disabled{cursor:default}.opt.dim{opacity:.45}
.why{margin:14px 0;padding:14px;border-radius:14px;background:#ffffff14;font-size:15px;line-height:1.45}
.score{font-family:Anton,Impact,sans-serif;font-size:96px;line-height:1;text-align:center;margin:10px 0 0}
.pts{text-align:center;font-size:20px;font-weight:700;color:var(--tech);margin:4px 0 14px}
.bar2{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--ai),var(--tech));border-radius:5px}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--lilac)}
.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:8px 0}
.grid i{aspect-ratio:1;border-radius:4px;background:#ffffff14}
.grid i.AI{background:#ff2e6e55}.grid i.Tech{background:#ffe60055}.grid i.Cyber{background:#7c4dff77}
.grid i.m{outline:2px solid #fff}.grid i.AI.t{background:var(--ai)}.grid i.Tech.t{background:var(--tech)}.grid i.Cyber.t{background:var(--cyber)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bd{padding:10px;border-radius:12px;background:#160c3a;border:1px solid var(--line);font-size:13px;line-height:1.3}
.bd b{display:block;font-size:14px}.bd.lock{opacity:.4}.bd.new{border-color:var(--tech)}
.sheet input,.sheet textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#160c3a;color:#fff;font:inherit;font-size:16px;margin:6px 0}
.sheet textarea{height:90px}
.term{padding:12px 0;border-bottom:1px solid var(--line)}.term b{display:block;font-size:17px}.term span{font-size:15px;color:var(--lilac);line-height:1.4}
.upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;padding:14px;border-radius:14px;background:var(--tech);color:#000;font-weight:700;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.trust{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--lilac);color:var(--lilac)}
.trust.Confirmed{border-color:#3ddc97;color:#3ddc97}.trust.Unverified{border-color:var(--ai);color:#ff7aa5}
.card.chat{border-style:dashed}
.xfeed{background:#000;border:1px solid #2f3336;border-radius:18px;overflow:hidden;margin:22px 0 10px;box-shadow:0 0 26px -12px #a98bff}
.xhead{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #2f3336;font-weight:700;font-size:16px}
.xlogo{display:block;width:20px;height:20px;color:#fff}.xlogo svg{display:block;width:100%;height:100%}
.xitem{position:relative;padding:14px 15px 14px 50px;border-bottom:1px solid #2f3336;cursor:pointer}
.xdot{position:absolute;left:18px;top:19px;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.xline{position:absolute;left:24px;top:35px;bottom:-20px;width:2px;background:linear-gradient(var(--c),#2f3336)}
.xitem:last-of-type{border-bottom:0}.xitem:last-of-type .xline{display:none}
.xwho{font-family:'Space Grotesk',monospace;font-size:13px;font-weight:700;color:var(--c);overflow-wrap:anywhere}
.xitem h3{font-size:18px;line-height:1.22;margin:5px 0}.xitem p{font-size:15px;line-height:1.4;color:#d8d2ee}
.xmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}.xmeta .trust,.xmeta .grp{margin-left:0}
.xitem .cue{color:var(--c)}
.xnote{padding:10px 15px;border-top:1px solid #2f3336;font-size:12px;color:#8b8fa0}
.grp{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#16b8f022;color:#7fdcff}
.hero::before{content:'';position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(rgba(11,6,32,0),rgba(11,6,32,.94) 62%);z-index:1;pointer-events:none}
.hero>canvas{z-index:0}.hero>*:not(canvas){z-index:2}
.pv{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;font-size:13px;font-weight:700}
.pv button{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:#160c3acc;font-size:21px;line-height:1}
.err{padding:40px 18px;font-size:18px}
footer{padding:0 16px 40px;font-size:14px;color:var(--lilac)}
footer a{display:inline-block;margin:4px 12px 4px 0;padding:4px 0}
</style>

<body>
<div id="app"></div>
<script>
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
const safe=u=>/^https:\/\//.test(u||'')?u:'#';
const src=s=>{const a=el('a',null,s.name+', '+s.date+' ↗');a.href=safe(s.url);a.target='_blank';a.rel='noopener';return a};
const fit=(n,max)=>{requestAnimationFrame(()=>{let s=max;n.style.fontSize=s+'px';const w=n.parentElement.clientWidth;while(n.scrollWidth>w&&s>30){s-=2;n.style.fontSize=s+'px'}})};
const BUILD='2026-11-07.6';
/* ---------- saved progress (this phone only) ---------- */
const KEY='mb-v1',DAY=/^\d{4}-\d{2}-\d{2}$/;
const fresh=()=>({days:{},tags:{AI:[0,0],Tech:[0,0],Cyber:[0,0]},lessons:{},points:0,badges:{},review:[],prog:{},sound:true});
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.days?Object.assign(fresh(),s):fresh()}catch(e){return fresh()}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const LEVELS=[[0,'Curious'],[100,'Learner'],[300,'Practitioner'],[600,'Analyst'],[1000,'Specialist'],[1600,'Expert'],[2500,'Master']];
const level=p=>{let i=0;LEVELS.forEach((l,j)=>{if(p>=l[0])i=j});const nx=LEVELS[i+1];return{name:LEVELS[i][1],i:i,from:LEVELS[i][0],next:nx?nx[0]:null}};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return ds(new Date(y,m-1,d+n))};
const todayStr=()=>ds(new Date());
const doneDays=()=>Object.keys(S.days).filter(k=>DAY.test(k)).sort();
function streak(){const set=new Set(doneDays());let d=todayStr();if(!set.has(d))d=addDays(d,-1);let n=0;while(set.has(d)){n++;d=addDays(d,-1)}return n}
const totalCorrect=()=>Object.values(S.tags).reduce((a,t)=>a+t[0],0);
const BADGES=[
 ['first','First quiz','Finish your first quiz',()=>doneDays().length>=1],
 ['perfect','Perfect day','Score 5 out of 5',()=>Object.values(S.days).some(d=>d.total>=5&&d.score===d.total)],
 ['s3','3-day streak','Quiz three days running',()=>streak()>=3],
 ['s7','7-day streak','Quiz seven days running',()=>streak()>=7],
 ['s30','30-day streak','Quiz thirty days running',()=>streak()>=30],
 ['c100','100 correct','Get 100 answers right',()=>totalCorrect()>=100],
 ['ai','AI scholar','25 correct AI answers',()=>S.tags.AI[0]>=25],
 ['tech','Tech scholar','25 correct Tech answers',()=>S.tags.Tech[0]>=25],
 ['cyber','Cyber scholar','25 correct Cyber answers',()=>S.tags.Cyber[0]>=25],
 ['back','Comeback','Clear a question you got wrong',()=>!!S.cleared],
 ['int','Interview ace','Get an interview question right',()=>!!S.interviewWin],
 ['lv3','Practitioner','Reach level Practitioner',()=>level(S.points).i>=2]];
function award(){const got=[];BADGES.forEach(([id,n,d,t])=>{if(!S.badges[id]&&t()){S.badges[id]=todayStr();got.push(n)}});return got}
/* ---------- sound and confetti ---------- */
let AC;const tone=(f,t,d,v)=>{if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.12,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}};
const sfx={ok:()=>{tone(660,0,.12);tone(880,.1,.18)},no:()=>{tone(180,0,.25,.1)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.25))};
function confetti(n,big){const c=document.getElementById('fx');if(!c||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;const x=c.getContext('2d'),col=['#ff2e6e','#ffe600','#7c4dff','#16b8f0','#3ddc97'];
  const P=[...Array(n)].map(()=>({x:innerWidth/2,y:big?innerHeight*.35:innerHeight*.6,vx:(Math.random()-.5)*(big?16:9),vy:-Math.random()*(big?15:10)-3,r:Math.random()*5+3,c:col[Math.floor(Math.random()*5)],life:1}));
  let last=performance.now();(function f(t){const dt=Math.min((t-last)/16,2);last=t;x.clearRect(0,0,c.width,c.height);let alive=0;P.forEach(p=>{p.vy+=.35*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.008*dt;if(p.life>0&&p.y<innerHeight+20){alive++;x.globalAlpha=Math.max(p.life,0);x.fillStyle=p.c;x.fillRect(p.x*d,p.y*d,p.r*d,p.r*d*.6)}});if(alive)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(last)}
/* ---------- sheets (full-screen panels with a working Back button) ---------- */
const stack=[];
addEventListener('popstate',()=>{const t=stack.pop();if(t){t.sh.remove();t.prev&&t.prev.focus&&t.prev.focus();if(!stack.length)document.body.style.overflow=''}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length)history.back()});
function sheet(tag,label){
  const prev=document.activeElement,sh=el('div','sheet');sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');
  const bar=el('div','bar'),cl=el('button','close','← Back');cl.onclick=()=>history.back();
  const pill=tag?el('span','pill '+tag,tag):el('strong',null,label||'');bar.append(pill,cl);
  const bd=el('div','body');sh.append(bar,bd);document.body.append(sh);document.body.style.overflow='hidden';cl.focus();history.pushState({s:1},'');stack.push({sh,prev});
  return{sh,bd,bar,pill,close:()=>history.back()}}
const SECTIONS=[['What happened','what'],['How it works','how'],['Why it matters','why']];
function openStory(st){
  const{bd}=sheet(st.tag),r=st.read||{};
  bd.append(el('h2',null,st.headline),el('div','meta','Source: '+st.source.name+', '+st.source.date));
  if(!st.read)bd.append(el('h3',null,'In short'),el('p',null,st.summary));
  SECTIONS.forEach(([t,k])=>{if(r[k])bd.append(el('h3',null,t),el('p',null,r[k]))});
  bd.append(el('h3',null,'So what'),el('p',null,st.soWhat.replace(/^[A-Za-z]+:\s*/,'')));
  if(r.take){const t=el('div','take');t.append(el('h3',null,'Claude’s take'),el('p',null,r.take));bd.append(t)}
  const o=el('a','orig','Read the original at '+st.source.name+' ↗');o.href=safe(st.source.url);o.target='_blank';o.rel='noopener';bd.append(o)}
const open=(n,st)=>{n.tabIndex=0;n.setAttribute('role','button');n.onclick=e=>{if(e.target.closest('a'))return;openStory(st)};n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openStory(st)}};n.append(el('span','cue','Read the short version →'))};
function openChatter(c){
  const{bd}=sheet(c.tag);bd.append(el('h2',null,c.headline),el('div','meta','Forum: '+c.thread.name+', '+c.thread.date+'. This is opinion, not reporting.'));
  bd.append(el('h3',null,'What people are discussing'),el('p',null,c.summary),el('h3',null,'The best insight'),el('p',null,c.insight),el('h3',null,'The other side'),el('p',null,c.dissent));
  const t=el('div','take');t.append(el('h3',null,'How far to trust it: '+c.trust),el('p',null,c.trustNote));bd.append(t);
  const a=el('a','orig','Read the discussion at '+c.thread.name+' ↗');a.href=safe(c.thread.url);a.target='_blank';a.rel='noopener';bd.append(a);
  if(c.original){const o=el('a','orig','Read the original: '+c.original.name+' ↗');o.href=safe(c.original.url);o.target='_blank';o.rel='noopener';bd.append(o)}}
const openC=(n,c)=>{n.tabIndex=0;n.setAttribute('role','button');n.onclick=e=>{if(e.target.closest('a'))return;openChatter(c)};n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openChatter(c)}};n.append(el('span','cue','Read the short version →'))};
/* ---------- quiz engine ---------- */
const pointsFor=run=>10+Math.min(run-1,4)*2;
const maxPoints=n=>{let t=0;for(let i=1;i<=n;i++)t+=pointsFor(i);return t+(n>=5?20:0)};
function play(items,o){
